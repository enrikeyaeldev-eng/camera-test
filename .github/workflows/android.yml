name: Android build

on:
  # Every branch is built so mistakes show up before they reach main; only main publishes a release.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with .devcontainer/setup-android.sh
  ANDROID_PACKAGES: >-
    platforms;android-36
    build-tools;36.0.0
    ndk;27.2.12479018
    cmake;3.22.1
  BUILD_TOOLS: "36.0.0"
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
  IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install $ANDROID_PACKAGES > /dev/null
          echo "Installed: $ANDROID_PACKAGES"

      - uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets on main
        if: env.IS_MAIN_PUSH == 'true' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions (see scripts/setup-signing.sh)."
          exit 1

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: apks
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/A56Cam-debug-${{ github.run_number }}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
            cp app/build/outputs/apk/release/app-release.apk out/A56Cam.apk
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release APK is unsigned (no signing secrets for this build); only the debug APK is uploaded."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: A56Cam-${{ github.run_number }}
          path: out/*.apk
          retention-days: 14

      - name: Publish rolling "latest" pre-release
        if: env.IS_MAIN_PUSH == 'true' && steps.apks.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          NOTES="Build ${{ github.run_number }} from commit ${GITHUB_SHA::7}. Download A56Cam.apk on the phone and install it over the previous version."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --prerelease --title "A56Cam latest (build ${{ github.run_number }})" --notes "$NOTES"
          else
            gh release create latest --prerelease --title "A56Cam latest (build ${{ github.run_number }})" --notes "$NOTES"
          fi
          gh release upload latest out/A56Cam.apk --clobber
          echo "Published: https://github.com/${{ github.repository }}/releases/download/latest/A56Cam.apk"
